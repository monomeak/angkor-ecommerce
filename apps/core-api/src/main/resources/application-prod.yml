spring:
    config:
        import: optional:file:.env.prod[.properties]

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        hakari:
            pool-name: angkor-commerce-pool
            maximum-pool-size: 10

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: false
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    tomcat:
        accesslog:
            enabled: true
            pattern: '%t %a "%m %U%q %H" %s %{ms}T ms "%{User-Agent}i"'

angkor:
    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS}
    cookie:
        secure: true
        same-site: Lax
    jwt:
        # HS256 secret; must be at least 256 bits. Override via env var in every real environment.
        secret: ${JWT_SECRET}
        access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES}
        refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS}
    storage:
        minio:
            endpoint: ${MINIO_ENDPOINT}
            access-key: ${MINIO_ACCESS_KEY}
            secret-key: ${MINIO_SECRET_KEY}
            bucket: ${MINIO_BUCKET}
            public-base-url: ${MINIO_PUBLIC_BASE_URL}
    default-currency: USD
    jsreport:
        url: ${JSREPORT_URL}
        username: ${JSREPORT_USER}
        password: ${JSREPORT_PASSWORD}
        timeout: 30s
    image:
        max-width: ${IMAGE_MAX_WIDTH:400}
        max-height: ${IMAGE_MAX_HEIGHT:400}
        quality: ${IMAGE_QUALITY:0.8}
        max-file-size: ${IMAGE_MAX_FILE_SIZE:5MB}
        max-per-product: ${MAX_PER_PRODUCT:5}

    allowed-types:
        - image/jpeg
        - image/png
        - image/webp

    extensions:
        "[image/jpeg]": jpg
        "[image/png]": png
        "[image/webp]": webp
management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true
    health:
        livenessstate:
            enabled: true
        readinessstate:
            enabled: true

springdoc:
    api-docs:
        path: /v3/api-docs

scalar:
    path: /scalar

logging:
    level:
        com.angkor.commerce: INFO
        org.springframework.security: INFO
