spring:
    config:
        import: optional:file:.env.dev[.properties]

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        hakari:
            pool-namea: angkor-commerce-pool
            maximum-pool-size: 10
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 10MB
    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC

    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    tomcat:
        accesslog:
            enabled: true
            pattern: '%t %a "%m %U%q %H" %s %{ms}T ms "%{User-Agent}i"'

angkor:
    cors:
        # Both portals run `next dev`, which defaults to 3000 and falls back to 3001 when
        # taken — so the port each one gets depends on start order. Allow both.
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    cookie:
        secure: false
        same-site: Lax
    product:
        max_images: 5
    jwt:
        # HS256 secret; must be at least 256 bits. Override via env var in every real environment.
        secret: ${JWT_SECRET:this-is-a-development-only-let-make-change-for-security-purpose}
        access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
        refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:10}
    storage:
        minio:
            endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
            access-key: ${MINIO_ACCESS_KEY:minioadmin}
            secret-key: ${MINIO_SECRET_KEY:minioadmin}
            bucket: ${MINIO_BUCKET:angkor-commerce-media}
            public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:9000/angkor-commerce-media}
    order:
        shipping-fee: 0
    default-currency: USD
    image:
        max-width: ${IMAGE_MAX_WIDTH:400}
        max-height: ${IMAGE_MAX_HEIGHT:400}
        quality: ${IMAGE_QUALITY:0.8}
        max-file-size: ${IMAGE_MAX_FILE_SIZE:5MB}
        max-per-product: ${MAX_PER_PRODUCT:5}

        allowed-types:
            - image/jpeg
            - image/png
            - image/webp

        extensions:
            "[image/jpeg]": jpg
            "[image/png]": png
            "[image/webp]": webp
    payment:
        default-provider: ABA_PAYWAY
        aba:
            base-url: ${ABA_BASE_URL:https://checkout-sandbox.payway.com.kh}
            merchant-id: ${ABA_MERCHANT_ID}
            api-key: ${ABA_API_KEY}
            callback-url: ${ABA_CALLBACK_URLZ:https://checkout-sandbox.payway.com.kh/callbacks}
            lifetime-minutes: 15
            payment-option: abapay_khqr
    wallet:
        seed:
            enabled: true
    jsreport:
        # core-api runs on the host in dev, so it reaches jsreport through the loopback port
        # docker-compose.override.yml publishes. Same fallbacks as the compose file.
        url: ${JSREPORT_URL:http://localhost:5480}
        username: ${JSREPORT_USER:admin}
        password: ${JSREPORT_PASSWORD:change_me_jsreport}
        timeout: 30s

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true
    health:
        livenessstate:
            enabled: true
        readinessstate:
            enabled: true

springdoc:
    api-docs:
        path: /v3/api-docs
    swagger-ui:
        path: /swagger-ui.html

logging:
    level:
        com.angkor.commerce: INFO
        org.springframework.security: INFO
