  jsreport:
    image: jsreport/jsreport:4.10.0
    container_name: js-report-service
    restart: unless-stopped
    shm_size: "1gb"
    # No host port and no CORS: only core-api calls jsreport, over the compose network at
    # http://jsreport:5488. The browser never does — jsreport cannot tell who is signed in.
    # Dev publishes it on loopback via docker-compose.override.yml for core-api and Studio.
    environment:
      extensions_authentication_enabled: "true"
      extensions_authentication_admin_username: ${JSREPORT_USER:-admin}
      extensions_authentication_admin_password: ${JSREPORT_PASSWORD:-change_me_jsreport}
      extensions_authentication_cookieSession_secret: ${JSREPORT_COOKIE_SECRET:-change_me_jsreport_cookie}
    volumes:
      - jsreport-data:/app/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    container_name: minio-service
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
    # No host ports published here — core-api always reaches MinIO over the
    # compose network at http://minio:9000. Local dev gets host access via
    # docker-compose.override.yml (auto-loaded); prod deliberately has none.
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: minio-initializer
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      MINIO_BUCKET: ${MINIO_BUCKET:-angkor-commerce-media}
      # Scoped credentials the app uses at runtime — never the MinIO root user/password.
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-angkor-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-change_me_app_secret}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb --ignore-existing "local/$${MINIO_BUCKET}";
      mc anonymous set download "local/$${MINIO_BUCKET}";
      mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}";
      printf "%s" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::$${MINIO_BUCKET}\",\"arn:aws:s3:::$${MINIO_BUCKET}/*\"]}]}" > /tmp/app-policy.json;
      mc admin policy create local angkor-app-rw /tmp/app-policy.json;
      mc admin policy attach local angkor-app-rw --user="$${MINIO_APP_ACCESS_KEY}" || true;
      echo "MinIO bucket initialized: $${MINIO_BUCKET} (app key: $${MINIO_APP_ACCESS_KEY}, scoped to bucket only)";
      '
volumes:
  postgres-data:
  minio-data:
  jsreport-data:
