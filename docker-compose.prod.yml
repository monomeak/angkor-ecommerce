services:
  minio:
    environment:
      # No insecure fallback here — prod must supply real values.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in your environment for prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your environment for prod}
    # No ports override needed: the base file no longer publishes MinIO's ports,
    # and this file is invoked without docker-compose.override.yml (explicit -f
    # flags skip it), so 9000/9001 stay off the host. Front the console via a
    # bastion/VPN if you need it in a real prod environment.

  minio-init:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in your environment for prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in your environment for prod}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in your environment for prod}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in your environment for prod}

  jsreport:
    environment:
      extensions_authentication_admin_username: ${JSREPORT_USER:?Set JSREPORT_USER in your environment for prod}
      extensions_authentication_admin_password: ${JSREPORT_PASSWORD:?Set JSREPORT_PASSWORD in your environment for prod}
      extensions_authentication_cookieSession_secret: ${JSREPORT_COOKIE_SECRET:?Set JSREPORT_COOKIE_SECRET in your environment for prod}
      # Templates are edited in dev Studio and shipped as files; prod only needs /api/report.
      extensions_studio_enabled: "false"

  core-api:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment for prod (256-bit random value)}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-10}
      # Internal, container-to-container address — the app never gets root creds.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Set MINIO_APP_ACCESS_KEY in your environment for prod}
      MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in your environment for prod}
      MINIO_BUCKET: ${MINIO_BUCKET:-angkor-commerce-media}
      # Externally reachable URL used to build public image links (CDN/reverse-proxy domain in real prod).
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:?Set MINIO_PUBLIC_BASE_URL, e.g. https://media.yourdomain.com/angkor-commerce-media}
      JSREPORT_URL: http://jsreport:5488
      JSREPORT_USER: ${JSREPORT_USER:?Set JSREPORT_USER in your environment for prod}
      JSREPORT_PASSWORD: ${JSREPORT_PASSWORD:?Set JSREPORT_PASSWORD in your environment for prod}
    depends_on:
      minio-init:
        condition: service_completed_successfully
